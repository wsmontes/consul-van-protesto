  <text x="1128" y="577" text-anchor="end" font-family="Arial,Helvetica,sans-serif" font-size="21" font-weight="900" fill="#173f8f">consulixobrasil.com</text>
  <text x="1128" y="598" text-anchor="end" font-family="Arial,Helvetica,sans-serif" font-size="11" font-weight="700" fill="#5f685f">SITE INDEPENDENTE · NÃO OFICIAL</text>
